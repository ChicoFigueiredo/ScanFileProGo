name: CI/CD Pipeline (Auto-Minor Release)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Versão customizada (ex: 1.0.0). Se vazio, incrementa minor automaticamente.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  # ====================================================
  # JOB 1: Análise Estática e Testes Automatizados
  # ====================================================
  test:
    name: Lint & Testes Automatizados
    runs-on: windows-latest
    env:
      # O detector de corrida (-race) exige CGO habilitado.
      CGO_ENABLED: '1'
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Baixar Dependências
        run: go mod download

      - name: Executar go vet
        run: go vet ./...

      - name: Executar Testes Unitários (com detector de corrida)
        run: go test -v -race ./...

      - name: Executar Testes da Interface (node --test)
        shell: pwsh
        run: |
          # Padrao entre aspas: o Node recente nao expande um diretorio em --test
          # e o PowerShell nao expande curingas para comandos nativos; quem faz o
          # glob e o proprio Node.
          if (Test-Path 'ui/tests') {
            node --test "ui/tests/**/*.test.mjs"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'Diretorio ui/tests ausente; etapa ignorada.'
          }

  # ====================================================
  # JOB 2: Cálculo de Versão Semântica (Auto Minor Increment)
  # ====================================================
  version:
    name: Calcular Versão Semântica
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc_version.outputs.version }}
      tag: ${{ steps.calc_version.outputs.tag }}
      is_release: ${{ steps.calc_version.outputs.is_release }}
    steps:
      - name: Checkout com Histórico Completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determinar Próxima Versão (Auto Minor Increment)
        id: calc_version
        run: |
          # 1. Se o usuário passou versão manual no workflow_dispatch
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            CLEAN_VER="${{ github.event.inputs.custom_version }}"
            CLEAN_VER="${CLEAN_VER#v}"
            TAG_NAME="v${CLEAN_VER}"
            IS_RELEASE="true"
          # 2. Se o gatilho foi uma Git Tag manual (ex: v1.0.0)
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            CLEAN_VER="${TAG_NAME#v}"
            IS_RELEASE="true"
          # 3. Se for push na branch main (Merge de PR ou commit direto)
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Buscar a maior tag semântica existente
            LATEST_TAG=$(git tag -l "v*.*.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)

            if [ -z "$LATEST_TAG" ]; then
              NEW_MAJOR=0
              NEW_MINOR=1
              NEW_PATCH=0
            else
              # Extrair Major, Minor, Patch
              RAW_VER="${LATEST_TAG#v}"
              MAJOR=$(echo "$RAW_VER" | cut -d. -f1)
              MINOR=$(echo "$RAW_VER" | cut -d. -f2)

              # A menos que dito o contrário, incrementa a Minor version
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$((MINOR + 1))
              NEW_PATCH=0
            fi

            CLEAN_VER="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
            TAG_NAME="v${CLEAN_VER}"
            IS_RELEASE="true"
          # 4. Se for Pull Request
          else
            LATEST_TAG=$(git tag -l "v*.*.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            RAW_VER="${LATEST_TAG#v}"
            [ -z "$RAW_VER" ] && RAW_VER="0.1.0"
            MAJOR=$(echo "$RAW_VER" | cut -d. -f1)
            MINOR=$(echo "$RAW_VER" | cut -d. -f2)
            NEW_MINOR=$((MINOR + 1))
            CLEAN_VER="${MAJOR}.${NEW_MINOR}.0-pr.${{ github.event.pull_request.number || github.run_number }}"
            TAG_NAME="v${CLEAN_VER}"
            IS_RELEASE="false"
          fi

          echo "Versão Calculada: ${CLEAN_VER} (Tag: ${TAG_NAME}, Criar Release: ${IS_RELEASE})"
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT

  # ====================================================
  # JOB 3: Compilação do Executável Windows (scanfile.exe)
  # ====================================================
  build:
    name: Build do Executável Windows
    needs: [test, version]
    runs-on: windows-latest
    env:
      # Binário autocontido, sem dependência de runtime C.
      CGO_ENABLED: '0'
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compilar scanfile.exe com Injeção de Versão
        shell: pwsh
        run: |
          $ver = "${{ needs.version.outputs.version }}"
          $commit = $env:GITHUB_SHA.Substring(0, 7)
          $buildDate = [DateTime]::UtcNow.ToString("yyyy-MM-dd HH:mm:ss") + " UTC"

          Write-Host "Compilando ScanFile Pro v$ver (Commit: $commit, Data: $buildDate)..."
          $ldflags = "-s -w -X 'main.Version=$ver' -X 'main.Commit=$commit' -X 'main.Date=$buildDate'"
          go build -ldflags $ldflags -o scanfile.exe .

      - name: Validar Executável Gerado
        shell: pwsh
        run: |
          .\scanfile.exe --version

      - name: Empacotar Release (ZIP + Checksum)
        shell: pwsh
        run: |
          $ver = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zipName = "scanfile-v$ver-windows-amd64.zip"
          Compress-Archive -Path scanfile.exe, README.md, LICENSE, docs -DestinationPath "dist/$zipName" -Force

          # Gerar SHA256 Checksum
          $hash = (Get-FileHash -Path "dist/$zipName" -Algorithm SHA256).Hash
          "$hash  $zipName" | Out-File -FilePath dist/checksums-sha256.txt -Encoding utf8

      - name: Upload de Artefatos do Build
        uses: actions/upload-artifact@v4
        with:
          name: scanfile-windows-amd64
          path: dist/*
          retention-days: 14

  # ====================================================
  # JOB 4: Publicação da Release no GitHub (com Tag Automática)
  # ====================================================
  release:
    name: Publicar GitHub Release Baixável
    needs: [version, build]
    if: needs.version.outputs.is_release == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.custom_version != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar Tag no Repositório (se não existir)
        run: |
          TAG_NAME="${{ needs.version.outputs.tag }}"
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release ScanFile Pro $TAG_NAME"
            git push origin "$TAG_NAME"
          fi

      - name: Download dos Artefatos Compilados
        uses: actions/download-artifact@v4
        with:
          name: scanfile-windows-amd64
          path: dist

      - name: Publicar GitHub Release com Anexos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "ScanFile Pro ${{ needs.version.outputs.tag }}"
          files: |
            dist/*.zip
            dist/checksums-sha256.txt
          generate_release_notes: true
          draft: false
          prerelease: false
