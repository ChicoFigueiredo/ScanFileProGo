name: CI/CD Pipeline (Auto-Minor Release)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Versão customizada (ex: 1.0.0). Se vazio, incrementa minor automaticamente.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  # ====================================================
  # JOB 1: Análise Estática e Testes Automatizados
  # ====================================================
  test:
    name: Lint & Testes Automatizados
    runs-on: windows-latest
    env:
      # O detector de corrida (-race) exige CGO habilitado.
      CGO_ENABLED: '1'
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Baixar Dependências
        run: go mod download

      - name: Executar go vet
        run: go vet ./...

      - name: Executar Testes Unitários (com detector de corrida)
        run: go test -v -race ./...

      - name: Executar Testes da Interface (node --test)
        shell: pwsh
        run: |
          # Padrao entre aspas: o Node recente nao expande um diretorio em --test
          # e o PowerShell nao expande curingas para comandos nativos; quem faz o
          # glob e o proprio Node.
          if (Test-Path 'ui/tests') {
            node --test "ui/tests/**/*.test.mjs"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'Diretorio ui/tests ausente; etapa ignorada.'
          }

  # ====================================================
  # JOB 2: Cálculo de Versão Semântica (Auto Minor Increment)
  # ====================================================
  version:
    name: Calcular Versão Semântica
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc_version.outputs.version }}
      tag: ${{ steps.calc_version.outputs.tag }}
      is_release: ${{ steps.calc_version.outputs.is_release }}
    steps:
      - name: Checkout com Histórico Completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determinar Próxima Versão (Auto Minor Increment)
        id: calc_version
        run: |
          # 1. Se o usuário passou versão manual no workflow_dispatch
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            CLEAN_VER="${{ github.event.inputs.custom_version }}"
            CLEAN_VER="${CLEAN_VER#v}"
            TAG_NAME="v${CLEAN_VER}"
            IS_RELEASE="true"
          # 2. Se o gatilho foi uma Git Tag manual (ex: v1.0.0)
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            CLEAN_VER="${TAG_NAME#v}"
            IS_RELEASE="true"
          # 3. Se for push na branch main (Merge de PR ou commit direto)
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Buscar a maior tag semântica existente
            LATEST_TAG=$(git tag -l "v*.*.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)

            if [ -z "$LATEST_TAG" ]; then
              NEW_MAJOR=0
              NEW_MINOR=1
              NEW_PATCH=0
            else
              # Extrair Major, Minor, Patch
              RAW_VER="${LATEST_TAG#v}"
              MAJOR=$(echo "$RAW_VER" | cut -d. -f1)
              MINOR=$(echo "$RAW_VER" | cut -d. -f2)

              # A menos que dito o contrário, incrementa a Minor version
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$((MINOR + 1))
              NEW_PATCH=0
            fi

            CLEAN_VER="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
            TAG_NAME="v${CLEAN_VER}"
            IS_RELEASE="true"
          # 4. Se for Pull Request
          else
            LATEST_TAG=$(git tag -l "v*.*.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            RAW_VER="${LATEST_TAG#v}"
            [ -z "$RAW_VER" ] && RAW_VER="0.1.0"
            MAJOR=$(echo "$RAW_VER" | cut -d. -f1)
            MINOR=$(echo "$RAW_VER" | cut -d. -f2)
            NEW_MINOR=$((MINOR + 1))
            CLEAN_VER="${MAJOR}.${NEW_MINOR}.0-pr.${{ github.event.pull_request.number || github.run_number }}"
            TAG_NAME="v${CLEAN_VER}"
            IS_RELEASE="false"
          fi

          echo "Versão Calculada: ${CLEAN_VER} (Tag: ${TAG_NAME}, Criar Release: ${IS_RELEASE})"
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT

  # ====================================================
  # JOB 3: Compilação do Executável Windows (scanfile.exe)
  # ====================================================
  build:
    name: Build do Executável Windows
    needs: [test, version]
    runs-on: windows-latest
    env:
      # Binário autocontido, sem dependência de runtime C.
      CGO_ENABLED: '0'
      # Vazio enquanto o projeto não estiver aprovado na SignPath Foundation.
      # Sendo vazio, os passos de assinatura são pulados e a release sai sem
      # assinatura, como sempre saiu. Ver docs/ASSINATURA-DE-CODIGO.md.
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Gerar Recursos do Windows (VERSIONINFO + manifesto)
        shell: pwsh
        run: |
          # A SignPath exige nome de produto e versão preenchidos em todo binário
          # que assina, e o Windows precisa deles para o executável não ser
          # anônimo. O .syso versionado no repositório é a rede de segurança;
          # aqui ele é regravado com a versão exata desta release.
          $ver = "${{ needs.version.outputs.version }}"
          go install github.com/tc-hib/go-winres@latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $winres = Join-Path (go env GOPATH) 'bin\go-winres.exe'
          & $winres make --in winres/winres.json --arch amd64 --file-version $ver --product-version $ver
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compilar scanfile.exe com Injeção de Versão
        shell: pwsh
        run: |
          $ver = "${{ needs.version.outputs.version }}"
          $commit = $env:GITHUB_SHA.Substring(0, 7)
          $buildDate = [DateTime]::UtcNow.ToString("yyyy-MM-dd HH:mm:ss") + " UTC"

          Write-Host "Compilando ScanFile Pro v$ver (Commit: $commit, Data: $buildDate)..."
          $ldflags = "-s -w -X 'main.Version=$ver' -X 'main.Commit=$commit' -X 'main.Date=$buildDate'"
          go build -ldflags $ldflags -o scanfile.exe .

      - name: Validar Executável Gerado
        shell: pwsh
        run: |
          .\scanfile.exe --version

          # Metadados: sem eles o binário é anônimo para o Windows e para o
          # antivírus, e a SignPath recusa assinar.
          $ver = "${{ needs.version.outputs.version }}"
          $info = (Get-Item scanfile.exe).VersionInfo
          Write-Host "VERSIONINFO: $($info.CompanyName) / $($info.ProductName) / v$($info.FileVersion)"

          $faltando = @()
          if (-not $info.CompanyName)      { $faltando += 'CompanyName' }
          if (-not $info.ProductName)      { $faltando += 'ProductName' }
          if (-not $info.FileDescription)  { $faltando += 'FileDescription' }
          if (-not $info.LegalCopyright)   { $faltando += 'LegalCopyright' }
          if (-not $info.OriginalFilename) { $faltando += 'OriginalFilename' }
          if ($faltando.Count -gt 0) {
            Write-Host "::error::Executável sem os metadados obrigatórios: $($faltando -join ', ')"
            exit 1
          }

          # A versão do recurso tem que casar com a da release, senão o binário
          # se anuncia com um número e se identifica com outro.
          $esperado = ($ver -split '-')[0]
          if (-not $info.FileVersion.StartsWith($esperado)) {
            Write-Host "::error::FileVersion do recurso ($($info.FileVersion)) nao casa com a versao da release ($esperado)"
            exit 1
          }

      # ----- Assinatura de código (SignPath Foundation) -----
      # Só roda quando os segredos existem. Enquanto o projeto não estiver
      # aprovado, os três passos abaixo são pulados sem quebrar o pipeline.
      - name: Enviar Binário Não Assinado como Artefato
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        id: artefato-nao-assinado
        uses: actions/upload-artifact@v4
        with:
          name: scanfile-unsigned
          path: scanfile.exe
          retention-days: 1

      - name: Assinar na SignPath Foundation
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.artefato-nao-assinado.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Conferir a Assinatura
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          # O binário assinado volta em signed/ e substitui o não assinado, de
          # modo que o ZIP e o checksum cubram o que foi assinado. Assinar
          # depois de gerar o checksum invalidaria o checksum.
          Move-Item -Path signed/scanfile.exe -Destination scanfile.exe -Force

          $sig = Get-AuthenticodeSignature .\scanfile.exe
          Write-Host "Assinatura: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Host "::error::Binário voltou da SignPath com assinatura $($sig.Status)"
            exit 1
          }

      - name: Empacotar Release (ZIP + Checksum)
        shell: pwsh
        run: |
          $ver = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zipName = "scanfile-v$ver-windows-amd64.zip"
          Compress-Archive -Path scanfile.exe, README.md, LICENSE, docs -DestinationPath "dist/$zipName" -Force

          # Gerar SHA256 Checksum
          $hash = (Get-FileHash -Path "dist/$zipName" -Algorithm SHA256).Hash
          "$hash  $zipName" | Out-File -FilePath dist/checksums-sha256.txt -Encoding utf8

      - name: Upload de Artefatos do Build
        uses: actions/upload-artifact@v4
        with:
          name: scanfile-windows-amd64
          path: dist/*
          retention-days: 14

  # ====================================================
  # JOB 4: Publicação da Release no GitHub (com Tag Automática)
  # ====================================================
  release:
    name: Publicar GitHub Release Baixável
    needs: [version, build]
    if: needs.version.outputs.is_release == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.custom_version != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar Tag no Repositório (se não existir)
        run: |
          TAG_NAME="${{ needs.version.outputs.tag }}"
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release ScanFile Pro $TAG_NAME"
            git push origin "$TAG_NAME"
          fi

      - name: Download dos Artefatos Compilados
        uses: actions/download-artifact@v4
        with:
          name: scanfile-windows-amd64
          path: dist

      - name: Publicar GitHub Release com Anexos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "ScanFile Pro ${{ needs.version.outputs.tag }}"
          files: |
            dist/*.zip
            dist/checksums-sha256.txt
          generate_release_notes: true
          draft: false
          prerelease: false
